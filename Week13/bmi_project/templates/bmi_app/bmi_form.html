<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }
        .box {
            width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }
        button {
            background: teal;
            color: white;
            border: none;
            cursor: pointer;
        }
        .clear-btn, .booking-btn {
            display: inline-block;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #999;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            box-sizing: border-box;
        }
        h2, h3, p {
            text-align: center;
        }
        pre {
            white-space: pre-wrap;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 6px;
        }

        .booking-btn:hover {
            background: #006666;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>BMI Calculator</h2>
        <form method="post">
            {% csrf_token %}
            <input type="number" name="weight" step="0.1" placeholder="Weight (kg)" required>
            <input type="number" name="height" step="0.1" placeholder="Height (cm)" required>
            <input type="number" name="age" step="0.1" placeholder="Age" required>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
            <button type="submit">Generate Plan</button>
            <a href="/" style="text-decoration:none;">
                <button type="button">Clear</button>
            </a>
        </form>
        <a href="{% url 'book_appointment' %}" class="booking-btn">
            Go to Booking Page
        </a>
        {% if bmi %}
            <p><strong>BMI:</strong> {{ bmi }}</p>
            <p><strong>Category:</strong> {{ category }}</p>
        {% endif %}

        {% if plan %}
            <h3>1-Month Diet and Exercise Plan</h3>
            <section style="text-align:left">{{ plan|safe }}</section>
        {% endif %}

        {% if error_message %}
            <p><strong>{{ error_message }}</strong></p>
        {% endif %}
    </div>
</body>
</html>
